schema_version = "1.4"
artifacts = ["/app/cartographer"]

[task]
name = "local/causal-restore-cartographer"
version = "1.0.0"
description = "Reconstruct a globally optimal consistent recovery from divergent offline replica histories."
keywords = ["distributed-systems", "replica-recovery", "causal-consistency", "wal", "crash-safety"]

[metadata]
