category = "programming"
tags = ["long-horizon-software-engineering", "storage", "recovery", "systems"]

[agent]
timeout_sec = 72000.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
storage_mb = 12288
gpus = 0

